name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Radio.apk
          cp diagnostico/build/outputs/apk/debug/diagnostico-debug.apk Diagnostico.apk

      - name: Guardar la APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Radio-apk
          path: |
            Radio.apk
            Diagnostico.apk

      - name: Publicar la APK como versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radio ${{ github.run_number }}
          files: |
            Radio.apk
            Diagnostico.apk
          make_latest: true
